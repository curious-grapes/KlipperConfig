[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world



[gcode_shell_command remote_beep]
command: ssh panini './test_sound.sh'
timeout: 5
verbose: True
[gcode_macro REMOTE_BEEP]
gcode:
    RUN_SHELL_COMMAND CMD=remote_beep

